<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrículas</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        /* MENÚ LATERAL */
        .banner {
            width: 250px;
            background: rgb(1, 1, 48);
            color: white;
            padding: 30px 20px;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
        }

        .banner h1 {
            font-size: 24px;
            margin-bottom: 30px;
        }

        .banner nav ul {
            list-style: none;
        }

        .banner nav ul li {
            margin: 15px 0;
        }

        .banner nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            transition: 0.3s;
        }

        .banner nav ul li a:hover {
            margin-left: 10px;
            font-weight: bold;
        }

        /* CONTENIDO */
        .content {
            flex: 1;
            padding: 40px;
            background-color: #f5f5f5;
        }

        .content h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .content p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        /* FORMULARIO */
        .formulario {
            max-width: 850px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
        }

        .formulario h3 {
            color: rgb(1, 1, 48);
            margin-bottom: 25px;
            font-size: 22px;
        }

        .fila {
            display: flex;
            gap: 20px;
            margin-bottom: 18px;
        }

        .campo {
            flex: 1;
        }

        .campo label {
            display: block;
            margin-bottom: 7px;
            color: #333;
            font-weight: bold;
        }

        .campo input,
        .campo select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        .campo input:focus,
        .campo select:focus {
            outline: none;
            border-color: rgb(1, 1, 48);
        }

        .botones {
            margin-top: 25px;
            display: flex;
            gap: 15px;
        }

        .btn {
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .btn-matricular {
            background-color: rgb(1, 1, 48);
            color: white;
        }

        .btn-matricular:hover {
            background-color: rgb(10, 10, 80);
        }

        .btn-limpiar {
            background-color: #ddd;
            color: #333;
        }

        .btn-limpiar:hover {
            background-color: #ccc;
        }

        </style>
</head>

<body>

    <div class="container">

        <!-- MENÚ LATERAL -->
        <aside class="banner">

            <h1>
                <img src="aiep-branding.png" alt="Logo" width="200px">
            </h1>

            <nav>
                <ul>
                    <li><a href="#inicio">Inicio</a></li>
                    <li><a href="#matricula">Matrícula</a></li>
                    <li><a href="#servicios">Servicios</a></li>
                    <li><a href="#productos">Productos</a></li>
                    <li><a href="#contacto">Contacto</a></li>
                    <li><a href="#acerca">Acerca de</a></li>
                </ul>
            </nav>

        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="content">

            <h2>Formulario de Matrícula</h2>

            <p>
                Completa el siguiente formulario con tus datos para realizar
                el proceso de matrícula.
            </p>

            <form class="formulario">

                <h3>Datos del estudiante</h3>

                <div class="fila">

                    <div class="campo">
                        <label for="nombre">Nombres</label>
                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            placeholder="Ingrese sus nombres"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="apellido">Apellidos</label>
                        <input
                            type="text"
                            id="apellido"
                            name="apellido"
                            placeholder="Ingrese sus apellidos"
                            required
                        >
                    </div>

                </div>

                <div class="fila">

                    <div class="campo">
                        <label for="rut">RUT</label>
                        <input
                            type="text"
                            id="rut"
                            name="rut"
                            placeholder="Ej: 12.345.678-9"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="fecha">Fecha de nacimiento</label>
                        <input
                            type="date"
                            id="fecha"
                            name="fecha"
                            required
                        >
                    </div>

                </div>

                <div class="fila">

                    <div class="campo">
                        <label for="correo">Correo electrónico</label>
                        <input
                            type="email"
                            id="correo"
                            name="correo"
                            placeholder="ejemplo@correo.com"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="telefono">Teléfono</label>
                        <input
                            type="tel"
                            id="telefono"
                            name="telefono"
                            placeholder="+56 9 1234 5678"
                            required
                        >
                    </div>

                </div>

                <h3>Datos académicos</h3>

                <div class="fila">

                    <div class="campo">
                        <label for="carrera">Carrera</label>

                        <select id="carrera" name="carrera" required>
                            <option value="">Seleccione una carrera</option>
                            <option value="informatica">
                                Ingeniería en Informática
                            </option>
                            <option value="administracion">
                                Administración de Empresas
                            </option>
                            <option value="contabilidad">
                                Contabilidad
                            </option>
                            <option value="enfermeria">
                                Técnico en Enfermería
                            </option>
                            <option value="prevencion">
                                Prevención de Riesgos
                            </option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="jornada">Jornada</label>

                        <select id="jornada" name="jornada" required>
                            <option value="">Seleccione una jornada</option>
                            <option value="diurna">Diurna</option>
                            <option value="vespertina">Vespertina</option>
                            <option value="online">Online</option>
                        </select>
                    </div>

                </div>

                <div class="fila">

                    <div class="campo">
                        <label for="sede">Sede</label>

                        <select id="sede" name="sede" required>
                            <option value="">Seleccione una sede</option>
                            <option value="santiago">Santiago</option>
                            <option value="maipu">Maipú</option>
                            <option value="providencia">Providencia</option>
                            <option value="san-bernardo">San Bernardo</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="nivel">Nivel</label>

                        <select id="nivel" name="nivel" required>
                            <option value="">Seleccione el nivel</option>
                            <option value="1">Primer año</option>
                            <option value="2">Segundo año</option>
                            <option value="3">Tercer año</option>
                            <option value="4">Cuarto año</option>
                        </select>
                    </div>

                </div>

                <div class="botones">

                    <button
                        type="submit"
                        class="btn btn-matricular">
                        Realizar matrícula
                    </button>

                    <button
                        type="reset"
                        class="btn btn-limpiar">
                        Limpiar
                    </button>

                </div>

            </form>

        </main>

    </div>

</body>
</html>
